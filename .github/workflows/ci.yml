name: C++ checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DORDER_BOOK_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test core and actual TCP/multicast processes
        run: cmake --build --preset ${{ matrix.preset }} --target check
      - name: Verify benchmark reporting tools
        run: python3 -m unittest discover -s tests/tools -v
      - name: Exercise the local trading demo
        run: python3 tools/run_trading_demo.py --bin-dir build/${{ matrix.preset }}
